name: Build Pages and Publish Backend Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  frontend:
    name: Build Vue frontend
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: jshERP-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 16
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: jshERP-web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production frontend
        run: npm run build

      - name: Verify Pages artifacts
        run: |
          test -f dist/index.html
          test -f dist/config.js
          test -f dist/404.html
          test -f dist/.nojekyll
          grep -q "white-space:nowrap" dist/css/*.css

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: jshERP-web/dist

  deploy:
    name: Deploy GitHub Pages
    needs: frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  backend-image:
    name: Build backend image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/smxcxlm/siyu-erp-backend:latest
            ghcr.io/smxcxlm/siyu-erp-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
