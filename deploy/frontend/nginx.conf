server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行时配置不缓存，切换后端域名后立即生效
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }
}
