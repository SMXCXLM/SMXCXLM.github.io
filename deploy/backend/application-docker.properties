server.port=9999
server.servlet.session.timeout=36000
server.servlet.context-path=/jshERP-boot

# Database (overridden by docker-compose environment)
spring.datasource.url=jdbc:mysql://mysql:3306/jsh_erp?useUnicode=true&characterEncoding=utf8&useCursorFetch=true&defaultFetchSize=500&allowMultiQueries=true&rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=jsh_erp
spring.datasource.password=change_me

# MyBatis-Plus
mybatis-plus.mapper-locations=classpath:./mapper_xml/*.xml

# Redis (overridden by docker-compose environment)
spring.redis.host=redis
spring.redis.port=6379
spring.redis.password=change_me

# Tenant settings
manage.roleId=10
tenant.userNumLimit=1000000
tenant.tryDayLimit=3000

# Plugin framework
plugin.runMode=prod
plugin.pluginPath=/app/plugins
plugin.pluginConfigFilePath=/app/pluginConfig

# Local file upload
file.uploadType=1
file.path=/app/upload
server.tomcat.basedir=/app/tmp/tomcat

# Upload size limit
spring.servlet.multipart.max-file-size=10485760
spring.servlet.multipart.max-request-size=10485760

# Logging
logging.file=/app/logs/jshERP.log
logging.level.root=info
